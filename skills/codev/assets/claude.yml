name: claude

# Generic @claude agent running INSIDE the codev CLI container
# (ghcr.io/flxbl-io/codev). Comment "@claude use codev to work on this" on an
# issue or PR — the codev skill at .claude/skills/codev/ supplies the rest.
#
# Setup (see skills/codev/references/github-actions.md for details):
#   Secrets: SFP_SERVER_TOKEN, GHA_TOKEN, and exactly one Claude credential:
#     CLAUDE_CODE_OAUTH_TOKEN (individual Claude subscription) or
#     ANTHROPIC_API_KEY (organization API key from console.anthropic.com)
#   Actions variables: SFP_SERVER_URL, SFP_POOL_TAG
#   Commit the codev skill at .claude/skills/codev/ in your repo.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flxbl-io/codev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHA_TOKEN }}
    env:
      SFP_SERVER_URL: ${{ vars.SFP_SERVER_URL }}
      SFP_SERVER_TOKEN: ${{ secrets.SFP_SERVER_TOKEN }}
      SFP_REPOSITORY: ${{ github.repository }}
      SFP_POOL_TAG: ${{ vars.SFP_POOL_TAG }}
      CODEV_PROVIDER: github
      CODEV_REPOSITORY_ID: ${{ github.event.repository.id }}
      CODEV_THREAD_ID: ${{ github.event.issue.id }}
      CODEV_THREAD_NUMBER: ${{ github.event.issue.number }}
      CODEV_THREAD_TYPE: ${{ github.event.issue.pull_request && 'pull_request' || 'issue' }}
      CODEV_AGENT_KIND: claude
      CODEV_EXECUTION_MODE: github_actions
      # PAT under a name the claude action does not clobber — the enterprise
      # forbids the Actions installation token from creating PRs.
      AGENT_GH_PAT: ${{ secrets.GHA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI (the codev image does not ship gh)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gh.tgz https://github.com/cli/cli/releases/download/v2.76.2/gh_2.76.2_linux_amd64.tar.gz
          tar -xzf /tmp/gh.tgz -C /tmp
          install -m 0755 /tmp/gh_2.76.2_linux_amd64/bin/gh /usr/local/bin/gh

      - name: Mark workspace safe for git
        # container bind-mounts the workspace under a different uid; without
        # this, git discovery fails ("not in a git directory") inside the action
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'

      - name: Begin codev agent telemetry
        run: |
          set -u
          if task_json=$(codev agent begin --repository "$SFP_REPOSITORY" --json); then
            if task_id=$(printf '%s' "$task_json" | node -e '
              const fs = require("fs")
              const value = JSON.parse(fs.readFileSync(0, "utf8"))
              if (!value.taskId) process.exit(1)
              process.stdout.write(value.taskId)
            '); then
              echo "CODEV_AGENT_TASK_ID=$task_id" >> "$GITHUB_ENV"
            else
              echo "::warning::codev telemetry did not return a task id"
            fi
          else
            echo "::warning::codev telemetry could not start; agent work will continue"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          # Set exactly ONE of these two secrets — the OAuth token is bound to
          # an individual's Claude subscription; organizations use an API key.
          # An unset secret resolves to an empty string, which the action
          # treats as absent.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # explicit token skips the action's GitHub-App OIDC exchange
          # (which needs id-token:write + the Claude GitHub App installed)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Link the agent pull request
        if: always()
        run: |
          set -u
          if [ -z "${CODEV_AGENT_TASK_ID:-}" ]; then
            exit 0
          fi

          if pr_number=$(GH_TOKEN="$AGENT_GH_PAT" gh pr view --json number --jq .number 2>/dev/null); then
            if ! codev agent link-pr --number "$pr_number" --repository "$SFP_REPOSITORY"; then
              echo "::warning::codev telemetry could not link pull request #$pr_number"
            fi
          fi
